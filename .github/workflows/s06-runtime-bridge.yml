name: S06 Novel Runtime bridge

on:
  push:
    branches:
      - codex/s06-runtime-bridge
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge-and-upstream-regression:
    name: Runtime transport and native regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out implementation
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json

      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix tests

      - name: Verify Runtime bridge and integration boundaries
        run: npm run test:novel

      - name: Regress upstream unit tests
        run: npm run test:unit --prefix tests -- --runInBand

      - name: Lint upstream and Novel sources
        run: npm run lint

      - name: Install Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Enable trusted server plugin in the ephemeral runner
        shell: bash
        run: |
          cp default/config.yaml config.yaml
          sed -i 's/^enableServerPlugins: false$/enableServerPlugins: true/' config.yaml
          sed -i 's/^enableServerPluginsAutoUpdate: true$/enableServerPluginsAutoUpdate: false/' config.yaml
          grep -q '^enableServerPlugins: true$' config.yaml
          grep -q '^enableServerPluginsAutoUpdate: false$' config.yaml

      - name: Start SillyTavern and run browser contracts
        timeout-minutes: 5
        shell: bash
        run: |
          npm start > "$RUNNER_TEMP/sillytavern.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=false
          for _ in {1..30}; do
            if curl --max-time 2 --fail --silent --show-error http://127.0.0.1:8000/ > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done

          if [[ "$ready" != true ]]; then
            cat "$RUNNER_TEMP/sillytavern.log"
            exit 1
          fi

          grep -q 'novel-runtime-bridge' "$RUNNER_TEMP/sillytavern.log"
          npm run test:e2e --prefix tests -- \
            generation-provider-registry.e2e.js \
            novel-runtime-bridge.e2e.js \
            --timeout=60000

      - name: Print server log on failure
        if: failure() || cancelled()
        run: cat "$RUNNER_TEMP/sillytavern.log" || true
