<div id="novel_mode_settings" class="novel-mode-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Novel Mode</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <label class="checkbox_label" for="novel_mode_enabled">
                <input id="novel_mode_enabled" type="checkbox">
                <span>Enabled</span>
            </label>
            <div class="novel-mode-status" aria-live="polite">
                <span>Runtime bridge</span>
                <span id="novel_mode_runtime_status">Disabled</span>
            </div>
            <button id="novel_mode_refresh" class="menu_button" type="button" title="Refresh Runtime bridge status">
                <i class="fa-solid fa-arrows-rotate" aria-hidden="true"></i>
                <span>Refresh</span>
            </button>
        </div>
    </div>
</div>
